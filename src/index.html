<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#101e2e"/>
<title>Nasasin – Monkey Hero</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;background:#0c1624}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:absolute;inset:0;pointer-events:none}#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}#left{width:min(355px,58vw)}.brand{font-size:12px;font-weight:900;letter-spacing:2px;color:#ffda76;text-shadow:0 2px 4px #000}.bar{margin-top:7px;height:17px;border-radius:99px;border:2px solid #ffffff40;overflow:hidden;background:#182337;box-shadow:0 2px 10px #0008;position:relative}.bar span{display:block;height:100%;transition:width .12s}.bar.hp span{background:linear-gradient(90deg,#e83d62,#ff8067)}.bar.xp{height:10px;margin-top:5px}.bar.xp span{background:linear-gradient(90deg,#7c6aff,#6eeaff)}.bar .label{position:absolute;inset:0;text-align:center;font-size:10px;font-weight:800;line-height:13px;text-shadow:0 1px 3px #000}#right{text-align:right;line-height:1.55;text-shadow:0 2px 6px #000;font-weight:800;font-size:13px}.pill{display:inline-block;background:#11283dca;border:1px solid #a4ddf044;border-radius:12px;padding:6px 10px}#equipment{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:14px;display:flex;gap:7px}.slot{width:55px;height:55px;background:#0a1930b8;border:2px solid #d2ad684f;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 15px #0004}.slot .emoji{font-size:23px}.slot small{font-weight:800;font-size:9px;color:#ffe4a3}#hint{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));right:16px;color:#fff9;font-weight:800;font-size:12px;text-shadow:0 2px 5px #000;text-align:right}#toast{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-weight:900;color:#ffefad;text-shadow:0 3px 8px #000;font-size:clamp(15px,3.5vw,27px);opacity:0;transition:opacity .15s;white-space:nowrap}#overlay{position:absolute;inset:0;background:linear-gradient(180deg,#061422be,#09202bea);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;pointer-events:auto}#overlay.hidden{display:none}.logo{font-size:clamp(45px,9vw,80px);filter:drop-shadow(0 7px 8px #0007)}h1{margin:4px 0 0;font-weight:1000;font-size:clamp(33px,7vw,58px);letter-spacing:-1.5px;color:#ffdb7f;text-shadow:0 5px 0 #874f2c,0 9px 12px #000b}#subtitle{max-width:480px;color:#d6edf8;line-height:1.6;font-size:15px;margin:12px 0 23px}button{cursor:pointer;background:linear-gradient(#fff1a0,#ffb648);border:0;border-bottom:5px solid #b96b2f;border-radius:16px;color:#4c301a;padding:13px 38px;font-size:19px;font-weight:1000;box-shadow:0 6px 20px #0006;pointer-events:auto}button:active{transform:translateY(2px);border-bottom-width:3px}.mini{color:#a9cedf;margin-top:18px;font-size:12px}#mute{position:absolute;top:105px;right:15px;pointer-events:auto;background:#11283dcf;border:1px solid #ffffff55;border-radius:10px;color:white;font-size:19px;padding:6px 9px;cursor:pointer}@media(max-width:600px){#mute{top:101px}.slot{width:47px;height:49px}#right{font-size:11px}#equipment{bottom:13px}#hint{font-size:10px;bottom:18px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div id="top"><div id="left"><div class="brand">🐵 NASASIN · MONKEY HERO</div><div class="bar hp"><span id="hpFill" style="width:100%"></span><div class="label" id="hpLabel">100 / 100 HP</div></div><div class="bar xp"><span id="xpFill" style="width:0%"></span></div></div><div id="right"><div class="pill" id="stats">🪙 0 &nbsp; ⭐ Lv.1<br/>🏃 0 m &nbsp; ☠️ 0</div></div></div><button id="mute" aria-label="Bật tắt âm thanh">🔊</button><div id="toast"></div><div id="equipment"><div class="slot"><span class="emoji" id="weapon">🪵</span><small id="weaponLabel">Gậy gỗ</small></div><div class="slot"><span class="emoji" id="armor">🧥</span><small id="armorLabel">Áo vải</small></div><div class="slot"><span class="emoji" id="spell">✨</span><small id="spellLabel">Chưởng I</small></div></div><div id="hint">CHẠM / SPACE<br/>ĐỂ NHẢY</div></div>
<div id="overlay"><div class="logo">🐒⚔️</div><h1 id="overlayTitle">MONKEY HERO</h1><div id="subtitle">Khỉ tự động chạy, nhặt kiếm và trang bị, tự tìm mục tiêu để đánh quái và bắn chưởng.<br/><b>Bạn chỉ cần chạm màn hình để nhảy!</b></div><button id="start">▶ CHƠI NGAY</button><div class="mini">PC: Space / ↑ &nbsp; • &nbsp; Điện thoại: chạm bất kỳ đâu</div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const $=s=>document.getElementById(s);let W=0,H=0,DPR=1,ground=0,playerX=0;let mode='menu',last=0,elapsed=0,scroll=0,speed=260,spawnTimer=0,lootTimer=0,obstacleTimer=0,toastTime=0,shake=0,kills=0,coins=0,level=1,xp=0,maxXp=40,weaponLv=0,armorLv=0,spellLv=1,attackTimer=0,magicTimer=0,invuln=0,muted=false,items=[],enemies=[],bolts=[],particles=[],decor=[];let player={y:0,vy:0,hp:100,maxHp:100,onGround:true,pose:0};let audio=null;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);ground=H*.79;playerX=Math.min(W*.27,250);if(mode==='menu')player.y=ground}window.addEventListener('resize',resize);resize();
function sound(freq=440,duration=.09,type='sine',volume=.035){if(muted)return;try{audio ||=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function reset(){elapsed=scroll=0;speed=260;spawnTimer=1.6;lootTimer=2.5;obstacleTimer=3.7;kills=coins=xp=weaponLv=armorLv=0;level=spellLv=1;maxXp=40;attackTimer=magicTimer=invuln=0;items=[];enemies=[];bolts=[];particles=[];decor=[];player={y:ground,vy:0,hp:100,maxHp:100,onGround:true,pose:0};for(let i=0;i<20;i++)decor.push({x:Math.random()*W*1.6,y:Math.random(),kind:Math.random()});updateHUD();mode='play';$('overlay').classList.add('hidden')}
function jump(){if(mode!=='play')return;if(player.onGround){player.vy=-Math.max(540,Math.min(720,H*.95));player.onGround=false;burst(playerX,player.y-4,'#e9d2a2',8);sound(310,.12,'triangle')}}
function input(e){if(e.target.closest&&e.target.closest('button'))return;e.preventDefault();if(mode==='play')jump()}window.addEventListener('pointerdown',input,{passive:false});window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}});$('start').addEventListener('click',e=>{e.stopPropagation();reset();sound(590,.14)});$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;$('mute').textContent=muted?'🔇':'🔊'});
function toast(text){$('toast').textContent=text;$('toast').style.opacity=1;toastTime=1.15}function burst(x,y,c,n=9){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=40+Math.random()*150;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,t:.35+Math.random()*.4,c,r:2+Math.random()*3})}}function hit(dmg){if(invuln>0)return;player.hp=Math.max(0,player.hp-dmg);invuln=.9;shake=8;burst(playerX,player.y-45,'#ff4c77',12);sound(135,.24,'sawtooth');if(player.hp<=0){mode='over';$('overlayTitle').textContent='HẾT MÁU!';$('subtitle').innerHTML=`Bạn đã chạy <b>${Math.floor(scroll/10)} m</b>, hạ <b>${kills} quái</b> và nhặt <b>${coins} xu</b>.<br/>Thử lại để lấy trang bị mạnh hơn nhé!`;$('start').textContent='↻ CHƠI LẠI';$('overlay').classList.remove('hidden')}}
function addXP(amount){xp+=amount;while(xp>=maxXp){xp-=maxXp;level++;maxXp=Math.floor(maxXp*1.34);player.maxHp+=12;player.hp=Math.min(player.maxHp,player.hp+35);toast('⭐ LÊN CẤP '+level+'!');burst(playerX,player.y-75,'#ffe078',22);sound(800,.24)}}
function spawnEnemy(){const kind=Math.random()<(Math.min(.45,elapsed/140))?'orc':'slime',scale=kind==='orc'?1.2:1;let hp=(kind==='orc'?52:30)+Math.floor(elapsed/13)*5;enemies.push({x:W+90,y:ground,kind,hp,maxHp:hp,scale,attack:0,dead:false,phase:Math.random()*10,reward:kind==='orc'?16:10})}
function spawnLoot(){const types=['coin','coin','coin','weapon','armor','spell','heart'];let type=types[Math.floor(Math.random()*types.length)];items.push({x:W+85,y:ground-(Math.random()>.65?100:48),type,phase:Math.random()*5,t:0})}
function spawnObstacle(){items.push({x:W+85,y:ground,type:'log',phase:0,t:0})}
function update(dt){if(mode!=='play')return;dt=Math.min(dt,.038);elapsed+=dt;scroll+=speed*dt;speed=Math.min(450,260+elapsed*1.4);player.pose+=dt*(player.onGround?13:5);ground=H*.79;player.vy+=1450*dt;player.y+=player.vy*dt;if(player.y>=ground){player.y=ground;player.vy=0;player.onGround=true}invuln=Math.max(0,invuln-dt);attackTimer-=dt;magicTimer-=dt;shake=Math.max(0,shake-30*dt);spawnTimer-=dt;lootTimer-=dt;obstacleTimer-=dt;toastTime-=dt;if(toastTime<=0)$('toast').style.opacity=0;
if(spawnTimer<=0){spawnEnemy();spawnTimer=1.25+Math.random()*1.15}if(lootTimer<=0){spawnLoot();lootTimer=1.65+Math.random()*1.8}if(obstacleTimer<=0){spawnObstacle();obstacleTimer=4+Math.random()*3.5}
for(const en of enemies){en.x-=speed*dt;en.phase+=dt*5;if(en.dead)continue;let dx=en.x-playerX,dy=(en.y-36)-(player.y-38);if(dx>0&&dx<78&&Math.abs(dy)<45&&attackTimer<=0){attackTimer=Math.max(.23,.49-weaponLv*.038);let dmg=14+weaponLv*14;en.hp-=dmg;burst(en.x-10,en.y-42,'#ffeb9f',9);sound(360+weaponLv*70,.07,'square');if(en.hp<=0)kill(en)}if(dx<32&&dx>-35&&Math.abs(dy)<53)hit(en.kind==='orc'?26:15)}
let target=enemies.filter(e=>!e.dead&&e.x>playerX+70&&e.x<playerX+520).sort((a,b)=>a.x-b.x)[0];if(target&&magicTimer<=0){magicTimer=Math.max(.38,1.05-spellLv*.11);bolts.push({x:playerX+21,y:player.y-65,tx:target,life:1.5,damage:12+spellLv*8});sound(650,.06,'sine',.015)}
for(const b of bolts){if(b.life<=0)continue;let t=b.tx;if(!t||t.dead){b.x+=600*dt;b.life-=dt;continue}let ty=t.y-40,dx=t.x-b.x,dy=ty-b.y,dist=Math.hypot(dx,dy);let move=(560+spellLv*65)*dt;if(dist<move+15){t.hp-=b.damage;b.life=0;burst(t.x,t.y-45,'#9dedff',7);sound(220,.05);if(t.hp<=0)kill(t)}else{b.x+=dx/dist*move;b.y+=dy/dist*move;b.life-=dt}}
for(const it of items){it.x-=speed*dt;it.t+=dt;if(it.type==='log'){if(Math.abs(it.x-playerX)<29&&player.y>ground-44)hit(13);continue}if(Math.abs(it.x-playerX)<43&&Math.abs(it.y-(player.y-42))<83){pickup(it);it.x=-200}}
items=items.filter(e=>e.x>-100);enemies=enemies.filter(e=>e.x>-130);bolts=bolts.filter(e=>e.life>0&&e.x<W+90);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt;p.t-=dt}particles=particles.filter(p=>p.t>0);for(const d of decor){d.x-=speed*dt*(.18+d.y*.35);if(d.x<-90){d.x=W+Math.random()*190;d.y=Math.random();d.kind=Math.random()}}updateHUD()}
function kill(en){if(en.dead)return;en.dead=true;kills++;coins+=2;addXP(en.reward);burst(en.x,en.y-40,en.kind==='orc'?'#a2d86f':'#8ff2ca',18);sound(430,.11,'triangle');if(Math.random()<.29)items.push({x:en.x,y:en.y-38,type:Math.random()<.65?'coin':'heart',phase:0,t:0})}
function pickup(it){let label='';switch(it.type){case'coin':coins+=5;label='+5 🪙';break;case'weapon':weaponLv++;label='⚔️ KIẾM CẤP '+weaponLv;break;case'armor':armorLv++;player.maxHp+=15;player.hp=Math.min(player.maxHp,player.hp+35);label='🛡️ GIÁP CẤP '+armorLv;break;case'spell':spellLv++;label='🔮 CHƯỞNG CẤP '+spellLv;break;case'heart':player.hp=Math.min(player.maxHp,player.hp+28);label='❤️ +28 HP';break}burst(it.x,it.y,'#ffe992',12);toast(label);sound(900,.13,'sine')}
function updateHUD(){$('hpFill').style.width=(player.hp/player.maxHp*100)+'%';$('hpLabel').textContent=`${Math.ceil(player.hp)} / ${player.maxHp} HP`;$('xpFill').style.width=(xp/maxXp*100)+'%';$('stats').innerHTML=`🪙 ${coins} &nbsp; ⭐ Lv.${level}<br/>🏃 ${Math.floor(scroll/10)} m &nbsp; ☠️ ${kills}`;$('weapon').textContent=weaponLv?'⚔️':'🪵';$('weaponLabel').textContent=weaponLv?'Kiếm '+weaponLv:'Gậy gỗ';$('armor').textContent=armorLv?'🛡️':'🧥';$('armorLabel').textContent=armorLv?'Giáp '+armorLv:'Áo vải';$('spell').textContent=spellLv>2?'🔮':'✨';$('spellLabel').textContent='Chưởng '+spellLv}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill()}
function background(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#143052');sky.addColorStop(.57,'#4f93a5');sky.addColorStop(1,'#a3ce9b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);circle(W*.76,H*.15,Math.max(25,W*.038),'#ffe4a8');for(let l=0;l<3;l++){let off=(scroll*(.09+l*.12))%(W*.6),base=ground-78+l*23;for(let x=-W;x<W*2;x+=W*.58){let px=x-off;poly([[px,base],[px+W*.24,base-105-l*10],[px+W*.55,base]],['#6b9f9b','#4c8a84','#39786e'][l])}}for(const d of decor){let x=d.x,y=ground-20;if(d.kind<.7){rr(x-5,y-75,10,80,5,'#5a5643');circle(x,y-82,31,'#356c51');circle(x-20,y-65,23,'#397c57');circle(x+20,y-66,24,'#42845a')}else{circle(x,y-7,12,'#456b53');circle(x+9,y-4,10,'#4d8252')}}ctx.fillStyle='#456e42';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#84ac54';ctx.fillRect(0,ground,W,12);ctx.fillStyle='#705444';ctx.fillRect(0,ground+30,W,H-ground);let offset=scroll%75;for(let x=-100-offset;x<W+100;x+=75){rr(x,ground+24,38,5,2,'#987251');rr(x+40,ground+72,20,5,2,'#876047');rr(x+16,ground+5,4,10,2,'#d5d46e')}}
function monkey(x,y){ctx.save();if(invuln>0&&Math.sin(elapsed*30)>0)ctx.globalAlpha=.45;let swing=player.onGround?Math.sin(player.pose)*7:3;ctx.strokeStyle='#754424';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-18,y-35);ctx.bezierCurveTo(x-50,y-28,x-50,y-70,x-24,y-74);ctx.stroke();ctx.strokeStyle='#59351f';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(x-9,y-18);ctx.lineTo(x-12+swing,y-1);ctx.moveTo(x+10,y-18);ctx.lineTo(x+9-swing,y-1);ctx.stroke();circle(x,y-43,25,'#91572f');circle(x-20,y-77,13,'#91572f');circle(x+17,y-77,13,'#91572f');circle(x-20,y-77,7,'#d8a077');circle(x+17,y-77,7,'#d8a077');circle(x,y-66,25,'#a56a3e');ctx.fillStyle='#efbf8b';ctx.beginPath();ctx.ellipse(x+6,y-60,17,15,0,0,Math.PI*2);ctx.fill();circle(x-5,y-72,4,'#211d20');circle(x+12,y-72,4,'#211d20');circle(x+15,y-60,3,'#673d29');ctx.strokeStyle='#70462e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+5,y-57,6,0,Math.PI);ctx.stroke();ctx.strokeStyle='#91572f';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x+15,y-44);ctx.lineTo(x+30,y-36+swing*.4);ctx.stroke();if(weaponLv){ctx.save();ctx.translate(x+30,y-37+swing*.4);ctx.rotate(-.45);rr(-3,-35,7,36,2,'#cde7ed');poly([[-6,-35],[.5,-53],[10,-35]],'#f2faff');rr(-11,-2,21,5,2,'#e0ae42');rr(-3,0,7,18,2,'#725035');ctx.restore()}if(armorLv)rr(x-14,y-49,30,29,8,armorLv>2?'#9777be':'#7695c2');ctx.restore()}
function enemyDraw(e){if(e.dead)return;let x=e.x,y=e.y;ctx.save();ctx.translate(x,y);let wobble=Math.sin(e.phase)*2;if(e.kind==='slime'){ctx.fillStyle='#75dc9c';ctx.beginPath();ctx.ellipse(0,-22+wobble,26,25,0,Math.PI,0);ctx.lineTo(26,-4);ctx.lineTo(-26,-4);ctx.closePath();ctx.fill();circle(-8,-26+wobble,4,'#244e4c');circle(9,-26+wobble,4,'#244e4c');rr(-9,-12+wobble,20,3,2,'#44866a')}else{circle(0,-52+wobble,22,'#66985a');rr(-18,-49+wobble,36,38,10,'#476e49');circle(-9,-56+wobble,4,'#fdefa5');circle(9,-56+wobble,4,'#fdefa5');poly([[-21,-69],[-30,-78],[-17,-75]],'#719a64');poly([[18,-69],[31,-78],[20,-76]],'#719a64');rr(17,-44,10,31,3,'#866344')}let health=Math.max(0,e.hp/e.maxHp);rr(-24,-91,48,6,3,'#1e3030');rr(-24,-91,48*health,6,3,'#fd796a');ctx.restore()}
function lootDraw(it){let x=it.x,y=it.y+Math.sin(it.t*5+it.phase)*5;if(it.type==='log'){rr(x-22,ground-29,44,29,9,'#775037');circle(x-12,ground-15,10,'#b78c59');circle(x-12,ground-15,5,'#775037');return}let col={coin:'#ffd35f',weapon:'#c4edf6',armor:'#b6b2fa',spell:'#d6a0fa',heart:'#fb7895'}[it.type];circle(x,y,23,col+'50');circle(x,y,18,'#153849');ctx.font='24px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText({coin:'🪙',weapon:'⚔️',armor:'🛡️',spell:'🔮',heart:'❤️'}[it.type],x,y+1)}
function draw(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);background();for(const it of items)lootDraw(it);for(const en of enemies)enemyDraw(en);circle(playerX,ground+5,27,'#122d2860');monkey(playerX,player.y);for(const b of bolts){ctx.shadowColor='#70e8ff';ctx.shadowBlur=20;circle(b.x,b.y,12,'#6aeaff');circle(b.x,b.y,6,'#fff');ctx.shadowBlur=0}for(const p of particles){ctx.globalAlpha=Math.min(1,p.t*2);circle(p.x,p.y,p.r,p.c)}ctx.globalAlpha=1;ctx.restore();if(mode==='menu'){ctx.fillStyle='#ffffff12';ctx.fillRect(0,0,W,H)}}
function frame(t){let dt=last?(t-last)/1000:0;last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
</body>
</html>
